plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'akz'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

subprojects {
	apply plugin: "java"
    apply plugin: "io.spring.dependency-management"

    repositories {
        mavenCentral()
        mavenLocal()
		maven {
			url uri('../repo') // o tu repositorio remoto
//			url = uri("https://maven.pkg.github.com/Alekz90/common-utils")
//			credentials {
//				username = project.findProperty("github.user") ?: System.getenv("GITHUB_USERNAME")
//				password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
//			}
		}
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

	dependencies {
        implementation 'akz:common-utils:1.0.0'
		implementation 'org.springframework.boot:spring-boot-starter-webmvc'
		testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.12'
        compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
