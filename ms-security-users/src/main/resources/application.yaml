server.port: 8081

spring:
  application:
    name: ms-security-users
  datasource:
    url: ${USERS_DB_URL}
    username: ${USERS_DB_USER}
    password: ${USERS_DB_PASSWORD}
    initialize: true
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect

jwt-configuration:
  secret-key: ${SECRET_KEY}
  expiration-time: 86400

cors-configuration:
  allowed-origins: 'http://localhost:4200, http://localhost:80, http://localhost:8080, http://localhost:5173'
  allowed-methods: 'GET, POST, PUT, DELETE, OPTIONS, PATCH'
  allowed-headers: '*'
  policy-directives: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'

springdoc:
  api-docs:
    enabled: true
  default-consumes-media-type: 'application/json'
  default-produces-media-type: 'application/json'

  enable-spring-security: true

  open-api:
    components.securitySchemes.bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    servers:
      - url: 'http://localhost:${server.port}'
        description: 'Development server'
      - url: 'https://api.alkz.com/security-users'
        description: 'Production server'
    info:
      title: 'Security Users API'
      description: 'API for managing security users in the system.'
      version: '1.0.0'
      terms-of-service: 'https://alkz.com/terms'
      contact:
        name: 'Alkz Support'
        url: 'https://alkz.com/support'
        email: 'alejd@alkz.com'
      license:
        name: 'MIT License'
        url: 'https://opensource.org/licenses/MIT'